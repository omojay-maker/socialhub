# 1TechLink Social Hub - web root lockdown
#
# The project lives inside Apache's document root (/var/www/html), so by
# default every file in it is downloadable: config/secrets.php, storage/logs,
# database/*.sql, the whole app/ tree and the frontend sources.
#
# This file is appended to the default site so that ONLY public/ is reachable.
# Install with:  sudo bash deploy/enable-webroot-lockdown.sh
#
# It is safe to apply with other projects under /var/www/html: the rules only
# name the social-hub path.

# ---------------------------------------------------------------------------
# 1. Deny the whole project, then re-open only the public/ entry point.
#    Apache applies the most specific matching <Directory> block, so the
#    public/ section below overrides this one for that subtree.
# ---------------------------------------------------------------------------
<Directory /var/www/html/PHP_projects/social-hub>
    Require all denied
</Directory>

<Directory /var/www/html/PHP_projects/social-hub/public>
    Require all granted

    # No directory listings, no .htaccess overrides inside the app.
    Options -Indexes
    AllowOverride None

    # Reject anything that is not a normal page/API request.
    <LimitExcept GET POST HEAD OPTIONS>
        Require all denied
    </LimitExcept>
</Directory>

# ---------------------------------------------------------------------------
# 2. Defence in depth inside public/: nothing that is not served by PHP.
# ---------------------------------------------------------------------------
<DirectoryMatch "^/var/www/html/PHP_projects/social-hub/public">
    # Dotfiles (.env, .git, .htaccess, .DS_Store)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Source, config and data files that must never be downloadable.
    <FilesMatch "\.(sql|md|log|ini|bak|dist|example|sample|old|sh|lock|yml|yaml|neon|twig|po|pot)$">
        Require all denied
    </FilesMatch>

    # Only index.php, media.php, the api/ directory and dist/ are reachable.
    <FilesMatch "\.(php|js|css|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|eot|map|txt|webmanifest)$">
        Require all granted
    </FilesMatch>
</DirectoryMatch>

# ---------------------------------------------------------------------------
# 3. Never serve the project with a directory index.
# ---------------------------------------------------------------------------
<Directory /var/www/html/PHP_projects/social-hub/public/api>
    Options -Indexes
    Require all granted
</Directory>

# ---------------------------------------------------------------------------
# 4. Static asset caching (the Vite build is content-hashed).
# ---------------------------------------------------------------------------
<Directory /var/www/html/PHP_projects/social-hub/public/dist>
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
    </IfModule>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
