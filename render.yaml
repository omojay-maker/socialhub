# Render Blueprint for 1TechLink Social Hub.
# Deploy: Render Dashboard → New → Blueprint → select the `socialhub` repo.
#
# ONE-TIME DB SETUP (Blueprint cannot run it for you): after the first
# deploy, open the web service → Shell tab and run:
#   php scripts/render_init_db.php
# This creates the schema and loads demo data. Never run it again on a live
# database — database/schema.sql drops tables.
#
# The database below is a managed Render Postgres (free tier: 1 GB, expires
# 30 days after creation — upgrade to Basic to keep it permanently). The web
# and cron services receive its DATABASE_URL automatically via fromDatabase,
# which the app prefers over the individual DB_* settings.
databases:
  - name: socialhub-db
    plan: free

services:
  - type: web
    name: socialhub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /PHP_projects/social-hub/public/api/csrf.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: SOCIAL_MODE
        value: mock
      - key: APP_KEY
        generateValue: true
      - key: SESSION_SECURE
        value: auto
      - key: DATABASE_URL
        fromDatabase:
          name: socialhub-db
          property: connectionString
      - key: APP_URL
        value: https://socialhub.onrender.com
      - key: PUBLIC_MEDIA_BASE
        value: https://socialhub.onrender.com
      - key: TERMS_URL
        value: https://socialhub.onrender.com/terms.html
      - key: PRIVACY_URL
        value: https://socialhub.onrender.com/privacy.html
      # OAuth credentials — paste from each developer portal when going live.
      # Instagram (or Meta app): INSTAGRAM_CLIENT_ID / INSTAGRAM_CLIENT_SECRET
      # LinkedIn: LINKEDIN_CLIENT_ID / LINKEDIN_CLIENT_SECRET
      # TikTok: TIKTOK_CLIENT_ID / TIKTOK_CLIENT_SECRET
      # X: TWITTER_CLIENT_ID / TWITTER_CLIENT_SECRET (+ OAuth 1.0a user tokens
      #    TWITTER_CONSUMER_KEY/SECRET + TWITTER_ACCESS_TOKEN/SECRET for posting)
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_ID
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false

  # Releases scheduled posts every 5 minutes (same as the local cron line).
  - type: cron
    name: socialhub-scheduler
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    command: php cron/publish_scheduled_posts.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: SOCIAL_MODE
        value: mock
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: socialhub-db
          property: connectionString
